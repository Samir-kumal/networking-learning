name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    # GitHub-hosted runners are unavailable (account billing is locked), so
    # this runs on the same self-hosted runner as deploy, sequentially.
    runs-on: [self-hosted, deploy]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit dependencies (high/critical only)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, deploy]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3008/ >/dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy in time" >&2
          docker compose logs --tail=100
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
