name: Cloudflare deploy

# Builds the vinext app and deploys it to Cloudflare Workers: first the Workers
# Response Store worker, then the application worker. Runs on GitHub-hosted runners.
on:
  workflow_dispatch: {}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (vinext, Workers runtime)
        run: npm run build:vinext

      - name: Deploy Workers Response Store
        run: npm run deploy:response-store

      - name: Deploy application Worker
        run: npm run deploy:vinext
